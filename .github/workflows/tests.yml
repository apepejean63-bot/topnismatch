name: TopnisMatch Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 03_Backend/topnismatch/topnismatch

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar suite completa de tests
        run: ./mvnw test

      - name: Publicar resultados de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados de Tests
          path: 03_Backend/topnismatch/topnismatch/target/surefire-reports/*.xml
          reporter: java-junit